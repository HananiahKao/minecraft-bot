<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Rendering Client</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 14px;
      font-family: monospace;
      z-index: 100;
    }

    #controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 100;
      user-select: none;
    }

    #controls p {
      margin: 4px 0;
    }

    #controls-toggle {
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
    }

    #controls-body {
      margin-top: 6px;
    }

    /* Hide keyboard controls entirely on touch devices — they don't apply */
    @media (hover: none) and (pointer: coarse) {
      #controls { display: none; }
    }

    #metrics {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 14px;
      border-radius: 5px;
      font-size: 11px;
      font-family: monospace;
      z-index: 100;
      line-height: 1.6;
      min-width: 200px;
      user-select: none;
    }

    #metrics-copy:hover {
      background: #555 !important;
    }

    #info {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 12px;
      font-family: monospace;
      z-index: 100;
    }

    #info p {
      margin: 5px 0;
    }

    #hotbar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      z-index: 100;
    }

    #vitals-hud {
      position: absolute;
      bottom: 76px; /* hotbar is 66px tall at 3x scale + 10px gap above the 10px hotbar offset */
      left: 50%;
      transform: translateX(-50%);
      width: 546px; /* matches the 3x-scaled hotbar.png width (182px native) */
      height: 56px; /* two stacked 27px rows, same fixed box regardless of which rows are visible */
      pointer-events: none;
      z-index: 100;
    }
    #vitals-hud .vitals-row {
      display: flex;
      height: 27px;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 100;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.85);
    }
    #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    #crosshair::after  { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }
  </style>
</head>
<body>
  <div id="canvas"></div>
  <div id="crosshair"></div>
  <div id="vitals-hud"></div>
  <div id="hotbar"></div>

  <div id="status">Connecting...</div>

  <div id="metrics">Loading...</div>

  <div id="controls">
    <span id="controls-toggle">▼ Controls</span>
    <div id="controls-body">
      <p>WASD - Move | Space - Jump | Shift - Sneak | Ctrl - Sprint</p>
      <p>Mouse - Look | Click to lock pointer | Right-click - Place | F - Pick block</p>
      <p>Hold ESC (don't just tap it) to release the mouse — your browser requires this</p>
      <p>Scroll / 1-9 - Select hotbar slot</p>
    </div>
  </div>
  <script>
    (function() {
      const toggle = document.getElementById('controls-toggle');
      const body   = document.getElementById('controls-body');
      let collapsed = false;
      toggle.addEventListener('click', () => {
        collapsed = !collapsed;
        body.style.display  = collapsed ? 'none' : '';
        toggle.textContent  = collapsed ? '▶ Controls' : '▼ Controls';
      });
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.150.0"
    }
  }
  </script>

  <script type="module" src="src/main.js"></script>
</body>
</html>
