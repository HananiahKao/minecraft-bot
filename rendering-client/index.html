<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Rendering Client</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 14px;
      font-family: monospace;
      z-index: 100;
    }

    #controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 100;
    }

    #controls p {
      margin: 5px 0;
    }

    #info {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 12px;
      font-family: monospace;
      z-index: 100;
    }

    #info p {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div id="canvas"></div>

  <div id="status">Connecting...</div>

  <div id="info">
    <p>Minecraft Rendering Client</p>
    <p id="fps">FPS: 0</p>
    <p id="chunks">Chunks: 0</p>
  </div>

  <div id="controls">
    <p><strong>Controls:</strong></p>
    <p>WASD - Move | Space - Up | Shift - Down</p>
    <p>Mouse - Look | Click to lock pointer</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.150.0"
    }
  }
  </script>

  <script type="module" src="src/main.js"></script>
</body>
</html>
