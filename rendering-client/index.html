<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Rendering Client</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 14px;
      font-family: monospace;
      z-index: 100;
    }

    #controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 100;
    }

    #controls p {
      margin: 5px 0;
    }

    #metrics {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 14px;
      border-radius: 5px;
      font-size: 11px;
      font-family: monospace;
      z-index: 100;
      line-height: 1.6;
      min-width: 200px;
      user-select: none;
    }

    #metrics-copy:hover {
      background: #555 !important;
    }

    #info {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 12px;
      font-family: monospace;
      z-index: 100;
    }

    #info p {
      margin: 5px 0;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 100;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.85);
    }
    #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    #crosshair::after  { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }
  </style>
</head>
<body>
  <div id="canvas"></div>
  <div id="crosshair"></div>

  <div id="status">Connecting...</div>

  <div id="metrics">Loading...</div>

  <div id="controls">
    <p><strong>Controls:</strong></p>
    <p>WASD - Move | Space - Jump | Shift - Sneak | Ctrl - Sprint</p>
    <p>Mouse - Look | Click to lock pointer</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.150.0"
    }
  }
  </script>

  <script type="module" src="src/main.js"></script>
</body>
</html>
